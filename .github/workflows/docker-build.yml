name: Docker Build & Push

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: []   # Add ragas-eval job here once eval is wired

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t docusage-api:${{ github.sha }} .

      - name: Run smoke test
        run: |
          docker run -d -p 8000:8000 --name docusage-test \
            -e OPENAI_API_KEY=test-key \
            -e QDRANT_URL=http://localhost:6333 \
            -e QDRANT_API_KEY=test \
            -e LANGFUSE_PUBLIC_KEY=test \
            -e LANGFUSE_SECRET_KEY=test \
            docusage-api:${{ github.sha }}

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "✅ Health check passed on attempt $i"
              break
            fi
            echo "Attempt $i/30 — waiting 2s..."
            sleep 2
          done

          curl -f http://localhost:8000/health
          docker stop docusage-test

      - name: Dump container logs on failure
        if: failure()
        run: docker logs docusage-test || true
