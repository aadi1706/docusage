name: Docker Build & Push

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: []   # Add ragas-eval job here once eval is wired

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t docusage-api:${{ github.sha }} .

      - name: Run smoke test
        run: |
          docker run -d -p 8000:8000 --name docusage-test \
            -e OPENAI_API_KEY=test-key \
            -e QDRANT_URL=http://localhost:6333 \
            -e QDRANT_API_KEY=test \
            -e LANGFUSE_PUBLIC_KEY=test \
            -e LANGFUSE_SECRET_KEY=test \
            docusage-api:${{ github.sha }}
          sleep 20
          curl -f http://localhost:8000/health
          docker stop docusage-test
