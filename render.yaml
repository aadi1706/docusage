services:
  - type: web
    name: docusage-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LIGHTWEIGHT_MODE
        value: "true"

  - type: web
    name: docusage-frontend
    runtime: python
    buildCommand: pip install -r requirements-frontend.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0
    plan: free
    region: oregon
    envVars:
      - key: API_BASE_URL
        value: https://docusage-api.onrender.com
